<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>404 — Arc</title>
<link rel="icon" type="image/png" href="/assets/Arc.png">
<meta name="robots" content="noindex">
<style>
  :root{
    --page:#080808; --text:#f5f5f5; --muted:#8a8a8a;
    --line:rgba(255,255,255,.09); --accent:#e9e9e9;
    --font:"Inter",system-ui,-apple-system,"Segoe UI",sans-serif;
  }
  @font-face{
    font-family:"Inter"; src:url("/assets/fonts/inter-var.woff2") format("woff2");
    font-weight:100 900; font-style:normal; font-display:swap;
  }
  *{box-sizing:border-box}
  html,body{height:100%}
  body{
    margin:0; background:var(--page); color:var(--text); font-family:var(--font);
    display:grid; place-items:center; padding:24px;
    -webkit-font-smoothing:antialiased;
  }
  body::before{
    content:""; position:fixed; inset:0; pointer-events:none;
    background:
      radial-gradient(60% 45% at 50% 0%, rgba(255,255,255,.06), transparent 70%),
      linear-gradient(rgba(255,255,255,.028) 1px, transparent 1px) 0 0/100% 44px;
  }
  .wrap{position:relative; text-align:center; max-width:440px}
  .mark{width:64px; height:64px; margin:0 auto 26px; display:block; opacity:.95}
  .code{
    font-size:82px; font-weight:680; letter-spacing:-.04em; line-height:1;
    background:linear-gradient(180deg,#fff,#9a9a9a); -webkit-background-clip:text;
    background-clip:text; color:transparent;
  }
  h1{margin:16px 0 10px; font-size:19px; font-weight:620; letter-spacing:-.01em}
  p{margin:0 0 28px; color:var(--muted); font-size:14.5px; line-height:1.6}
  .actions{display:flex; gap:10px; justify-content:center; flex-wrap:wrap}
  a{
    text-decoration:none; font-size:13.5px; font-weight:560; padding:10px 18px;
    border-radius:10px; border:1px solid var(--line); color:var(--text);
    transition:border-color .18s ease, background .18s ease, transform .18s ease;
  }
  a:hover{border-color:rgba(255,255,255,.26); background:rgba(255,255,255,.05); transform:translateY(-1px)}
  a.solid{background:var(--accent); color:#0d0d0d; border-color:transparent}
  a.solid:hover{background:#fff}
</style>
</head>
<body>
  <main class="wrap">
    <img class="mark" src="/arc-logo-white.png" alt="" aria-hidden="true">
    <div class="code">404</div>
    <h1>This page doesn't exist</h1>
    <p>The link may be old, or the page may have moved. Everything else is still here.</p>
    <div class="actions">
      <a class="solid" href="/">Back to Arc</a>
      <a href="/script/">Loader</a>
      <a href="/shop/">Shop</a>
      <a href="/script/statistics/">Live stats</a>
    </div>
  </main>
</body>
</html>
