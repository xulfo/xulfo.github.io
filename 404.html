<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Oxide HUB</title><link rel="icon" href="/assets/Oxide.png?v=2">
<style>
@font-face{font-family:Inter;src:url('/assets/fonts/inter-var.woff2') format('woff2');font-weight:100 900;font-display:swap}
*{box-sizing:border-box;margin:0;padding:0}:root{--text:#f3f4f6;--muted:#a2a7b1;--line:rgba(255,255,255,.1);--panel:rgba(10,11,15,.72);--accent:#81a3d6}
body{min-height:100vh;background:#07080b;color:var(--text);font:14px Inter,system-ui,sans-serif;display:flex;align-items:center;justify-content:center;overflow-x:hidden}
.bg{position:fixed;inset:0;background:#07080b;z-index:0}.bg img{width:100%;height:100%;object-fit:cover;opacity:.7}.bg:after{content:"";position:absolute;inset:0;background:linear-gradient(180deg,rgba(7,8,11,.28),rgba(7,8,11,.82)),radial-gradient(ellipse at 50% 0%,transparent,rgba(7,8,11,.75))}
.top{position:fixed;z-index:2;top:22px;left:50%;transform:translateX(-50%);width:min(720px,calc(100% - 40px));display:flex;justify-content:space-between}.brand,.back{color:var(--text);text-decoration:none;font-weight:700;font-size:14px}.brand{display:flex;gap:9px;align-items:center}.brand img{width:22px;height:22px;border-radius:6px}.back{color:var(--muted);font-weight:500}
.card{position:relative;z-index:1;width:min(440px,calc(100% - 32px));margin:88px auto 30px;padding:38px 28px 26px;text-align:center;background:var(--panel);border:1px solid var(--line);border-radius:22px;backdrop-filter:blur(25px);box-shadow:0 28px 90px #0009;display:none}
.card.show{display:block}
.eyebrow{text-transform:uppercase;letter-spacing:.2em;font-size:10px;color:var(--muted);font-weight:700;margin-bottom:18px}
.avatar{width:104px;height:104px;object-fit:cover;border-radius:25px;border:1px solid rgba(255,255,255,.2);box-shadow:0 12px 35px #0009}
.name{font-size:29px;letter-spacing:-.04em;margin-top:17px}.handle{color:var(--muted);font-size:13px;margin-top:3px}
.status{display:inline-flex;gap:7px;align-items:center;margin-top:13px;border:1px solid var(--line);border-radius:99px;padding:4px 11px;color:var(--muted);font-size:11px}.dot{width:7px;height:7px;border-radius:50%;background:#70d28a}
.tags{display:flex;flex-wrap:wrap;justify-content:center;gap:7px;margin-top:16px}.tag{border:1px solid var(--line);border-radius:99px;padding:4px 10px;color:var(--muted);font-size:11px}
.bio{white-space:pre-line;color:var(--muted);line-height:1.6;margin:18px auto 0;max-width:330px;font-size:13px}
.links{display:grid;gap:9px;margin-top:25px;text-align:left}.link{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:13px 15px;border:1px solid var(--line);border-radius:12px;color:var(--text);background:rgba(255,255,255,.04);text-decoration:none;transition:.2s}.link:hover{transform:translateY(-2px);border-color:rgba(129,163,214,.55);background:rgba(129,163,214,.09)}.arrow{color:var(--muted);font-size:18px}
.foot{color:#737985;font-size:11px;margin-top:25px}.foot a{color:inherit;text-decoration:none}
.plain{position:relative;z-index:1;text-align:center;padding:40px 20px}.plain h1{font-size:44px;letter-spacing:-.04em;margin-bottom:12px}.plain p{color:var(--muted);line-height:1.6}.plain a{display:inline-block;margin-top:22px;padding:11px 20px;border-radius:11px;background:var(--accent);color:#101722;font-weight:700;text-decoration:none}
@media(max-width:500px){.top{top:15px}.card{margin-top:70px;padding:30px 20px 23px}}
</style></head><body>
<div class="bg"><img id="background" alt=""></div>
<header class="top"><a class="brand" href="/"><img src="/assets/Oxide.png?v=2" alt="">Oxide HUB</a><a class="back" href="/">Back to hub</a></header>
<main class="card" id="card"><div class="eyebrow">Oxide profile</div><img class="avatar" id="avatar" src="/assets/Oxide.png" alt=""><h1 class="name" id="name">Profile</h1><div class="handle" id="handle">@profile</div><div class="status"><span class="dot"></span><span id="status">Available</span></div><div class="tags" id="tags"></div><p class="bio" id="bio"></p><div class="links" id="links"></div><div class="foot">Made with <a href="/">Oxide HUB</a></div></main>
<div class="plain" id="plain" style="display:none"><h1>404</h1><p>This page doesn't exist.</p><a href="/">Back to Oxide HUB</a></div>
<script>
(function(){
  var API='https://adorable-sallyanne-fgdfgdfgd-b2d051be.koyeb.app';
  var m=location.pathname.match(/^\/([a-z0-9_]{2,24})\/?$/i);
  if(!m){document.getElementById('plain').style.display='block';return}
  var handle=m[1].toLowerCase();
  document.title='@'+handle+' — Oxide profile';
  fetch(API+'/profile/'+encodeURIComponent(handle))
    .then(function(r){if(!r.ok)throw 0;return r.json()})
    .then(function(j){
      var p=j.profile||{};
      document.getElementById('card').classList.add('show');
      document.title=(p.name||handle)+' — Oxide profile';
      document.getElementById('name').textContent=p.name||handle;
      document.getElementById('handle').textContent='@'+handle;
      document.getElementById('status').textContent=p.status||'Available';
      document.getElementById('bio').textContent=p.bio||'';
      if(p.avatar)document.getElementById('avatar').src=p.avatar;
      if(p.background)document.getElementById('background').src=p.background;
      (p.tags||'').split(',').map(function(x){return x.trim()}).filter(Boolean).forEach(function(t){
        var e=document.createElement('span');e.className='tag';e.textContent=t;
        document.getElementById('tags').appendChild(e);
      });
      (p.links||[]).forEach(function(l){
        var a=document.createElement('a');a.className='link';a.href=l.url;a.target='_blank';a.rel='noopener noreferrer';
        a.innerHTML='<span>'+l.label+'</span><span class="arrow">→</span>';
        document.getElementById('links').appendChild(a);
      });
    })
    .catch(function(){
      document.getElementById('plain').style.display='block';
      document.querySelector('.plain h1').textContent='Profile not found';
      document.querySelector('.plain p').textContent='This profile doesn\u2019t exist yet. Create yours with the Oxide profile builder.';
      document.querySelector('.plain a').href='/create/';
      document.querySelector('.plain a').textContent='Create your profile';
    });
})();
</script></body></html>
