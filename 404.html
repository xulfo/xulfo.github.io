<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Oxide HUB</title><link rel="icon" href="/assets/Oxide.png?v=2">
<style>
@font-face{font-family:Inter;src:url('/assets/fonts/inter-var.woff2') format('woff2');font-weight:100 900;font-display:swap}
*{box-sizing:border-box;margin:0;padding:0}:root{--text:#f4f5f7;--muted:#a2a7b1;--line:rgba(255,255,255,.09);--card:#101216;--accent:#81a3d6}
body{min-height:100vh;background:#07080b;color:var(--text);font:14px Inter,system-ui,sans-serif;display:flex;align-items:center;justify-content:center;overflow-x:hidden}
.bg{position:fixed;inset:0;background:#07080b;z-index:0}.bg img{width:100%;height:100%;object-fit:cover;opacity:.55}.bg:after{content:"";position:absolute;inset:0;background:linear-gradient(180deg,rgba(7,8,11,.35),rgba(7,8,11,.85))}
.top{position:fixed;z-index:3;top:22px;left:50%;transform:translateX(-50%);width:min(720px,calc(100% - 40px));display:flex;justify-content:space-between}.brand,.back{color:var(--text);text-decoration:none;font-weight:700;font-size:14px}.brand{display:flex;gap:9px;align-items:center}.brand img{width:22px;height:22px;border-radius:6px}.back{color:var(--muted);font-weight:500}
.card{position:relative;z-index:1;width:min(440px,calc(100% - 32px));margin:88px auto 30px;overflow:hidden;text-align:center;background:var(--card);border:1px solid var(--line);border-radius:22px;box-shadow:0 28px 90px #0009;display:none}.card.show{display:block}
.banner{position:relative;height:122px;background:#0b0d10}.banner img{width:100%;height:100%;object-fit:cover;display:block}.banner:after{content:"";position:absolute;inset:0;background:linear-gradient(180deg,rgba(0,0,0,.10),rgba(10,11,15,.88))}
.avatar{width:102px;height:102px;object-fit:cover;border-radius:26px;border:4px solid var(--card);box-shadow:0 12px 34px #000a;margin-top:-52px;position:relative;z-index:2;display:block;margin-left:auto;margin-right:auto}
.body{padding:14px 30px 30px;position:relative;z-index:1}
.name{font-size:28px;font-weight:800;letter-spacing:-.04em;line-height:1.15}.name-row{display:flex;align-items:center;justify-content:center;gap:9px}
.verified{width:21px;height:21px;flex:none;border-radius:50%;display:grid;place-items:center;background:#3b82f6;color:#fff;box-shadow:0 0 0 3px rgba(59,130,246,.14),0 4px 14px rgba(59,130,246,.3)}.verified svg{width:12px;height:12px;display:block}
.handle{color:var(--muted);font-size:13px;margin-top:4px}
.status{display:inline-flex;gap:7px;align-items:center;margin-top:13px;border:1px solid var(--line);border-radius:99px;padding:4px 12px;color:var(--muted);font-size:11px;background:rgba(255,255,255,.03)}.dot{width:7px;height:7px;border-radius:50%;background:#70d28a;position:relative}.dot:after{content:"";position:absolute;inset:-4px;border-radius:50%;border:1px solid rgba(112,210,138,.5);animation:pulse 2s ease-out infinite}@keyframes pulse{0%{transform:scale(.5);opacity:1}100%{transform:scale(1.4);opacity:0}}
.tags{display:flex;flex-wrap:wrap;justify-content:center;gap:7px;margin-top:15px}.tag{border:1px solid var(--line);border-radius:99px;padding:4px 11px;color:var(--muted);font-size:11px;background:rgba(255,255,255,.03)}
.bio{white-space:pre-line;color:var(--muted);line-height:1.65;margin:17px auto 0;max-width:330px;font-size:13.5px}
.links{display:grid;gap:9px;margin-top:24px;text-align:left}.link{display:flex;align-items:center;gap:13px;padding:11px 14px;border:1px solid var(--line);border-radius:13px;color:var(--text);background:rgba(255,255,255,.035);text-decoration:none;transition:.18s}.link:hover{transform:translateY(-1.5px);border-color:rgba(129,163,214,.55);background:rgba(129,163,214,.08)}
.link-icon{width:36px;height:36px;flex:none;border-radius:10px;display:grid;place-items:center;background:rgba(255,255,255,.07);color:#fff}.link-icon svg{width:18px;height:18px;fill:currentColor}.link-icon img{width:24px;height:24px;object-fit:contain;display:block}.link-label{flex:1;font-size:14px;font-weight:700}.arrow{color:var(--muted);font-size:17px;transition:transform .18s}.link:hover .arrow{transform:translateX(3px)}
.foot{color:#737985;font-size:11px;margin-top:24px}.foot a{color:inherit;text-decoration:none}
.music-btn{position:fixed;z-index:3;top:16px;right:16px;width:42px;height:42px;border-radius:50%;border:1px solid var(--line);background:rgba(10,11,15,.7);backdrop-filter:blur(14px);color:var(--muted);cursor:pointer;display:none;place-items:center;transition:.2s}.music-btn:hover{color:var(--text)}.music-btn.playing{color:var(--accent);border-color:rgba(129,163,214,.5)}.music-btn svg{width:19px;height:19px}.music-btn .disc{display:none;animation:spin 2.6s linear infinite}.music-btn .note{display:block}.music-btn.playing .disc{display:block}.music-btn.playing .note{display:none}@keyframes spin{to{transform:rotate(360deg)}}
.plain{position:relative;z-index:1;text-align:center;padding:40px 20px}.plain h1{font-size:44px;letter-spacing:-.04em;margin-bottom:12px}.plain p{color:var(--muted);line-height:1.6}.plain a{display:inline-block;margin-top:22px;padding:11px 20px;border-radius:11px;background:var(--accent);color:#101722;font-weight:700;text-decoration:none}
@media(max-width:500px){.top{top:15px}.card{margin-top:70px}}
</style></head><body>
<div class="bg"><img id="background" alt=""></div>
<header class="top"><a class="brand" href="/"><img src="/assets/Oxide.png?v=2" alt="">Oxide HUB</a><a class="back" href="/">Back to hub</a></header>
<button class="music-btn" id="musicBtn" aria-label="Toggle music"><svg class="note" viewBox="0 0 24 24" fill="currentColor"><path d="M9 18.5a3.5 3.5 0 1 1-2-3.16V5.4a1 1 0 0 1 .76-.97l9-2.25A1 1 0 0 1 18 3.15v11.19a3.5 3.5 0 1 1-2-3.16V8.02l-7 1.75v8.73Z"/></svg><svg class="disc" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="9"/><circle cx="12" cy="12" r="2.5" fill="currentColor" stroke="none"/><path d="M12 3a9 9 0 0 1 9 9" stroke-linecap="round"/></svg></button>
<main class="card" id="card"><div class="banner"><img id="bannerImg" alt=""></div><img class="avatar" id="avatar" src="/assets/Oxide.png" alt=""><div class="body"><div class="name-row"><h1 class="name" id="name">Profile</h1><span class="verified" title="Verified"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><path d="m6.5 12.5 3.5 3.5 7.5-8"/></svg></span></div><div class="handle" id="handle">@profile</div><div class="status"><span class="dot"></span><span id="status">Available</span></div><div class="tags" id="tags"></div><p class="bio" id="bio"></p><div class="links" id="links"></div><div class="foot">Made with <a href="/">Oxide HUB</a></div></div></main>
<div class="plain" id="plain" style="display:none"><h1>404</h1><p>This page doesn't exist.</p><a href="/">Back to Oxide HUB</a></div>
<audio id="audio" loop preload="none"></audio>
<script>
(function(){
  var API='https://adorable-sallyanne-fgdfgdfgd-b2d051be.koyeb.app';
  var m=location.pathname.match(/^\/([a-z0-9_]{2,24})\/?$/i);
  if(!m){document.getElementById('plain').style.display='block';return}
  var handle=m[1].toLowerCase();
  document.title='@'+handle+' — Oxide profile';
  function iconFor(label,url){
    var s=(label+' '+(url||'')).toLowerCase();
    if(s.indexOf('discord')>-1)return '<svg viewBox="0 0 24 24"><path d="M20.317 4.37a19.8 19.8 0 0 0-4.885-1.515.074.074 0 0 0-.079.037c-.21.375-.444.865-.608 1.25a18.27 18.27 0 0 0-5.487 0 12.64 12.64 0 0 0-.617-1.25.077.077 0 0 0-.079-.037A19.74 19.74 0 0 0 3.677 4.37a.07.07 0 0 0-.032.027C.533 9.046-.32 13.58.099 18.058a.082.082 0 0 0 .031.056 19.9 19.9 0 0 0 5.993 3.03.078.078 0 0 0 .084-.028 14.09 14.09 0 0 0 1.226-1.994.076.076 0 0 0-.041-.106 13.1 13.1 0 0 1-1.872-.892.077.077 0 0 1-.008-.128 10.2 10.2 0 0 0 .372-.291.074.074 0 0 1 .077-.01c3.928 1.793 8.18 1.793 12.062 0a.074.074 0 0 1 .078.01c.12.098.246.198.373.292a.077.077 0 0 1-.006.127 12.3 12.3 0 0 1-1.873.892.077.077 0 0 0-.041.107c.36.698.772 1.362 1.225 1.993a.076.076 0 0 0 .084.028 19.84 19.84 0 0 0 6.002-3.03.077.077 0 0 0 .032-.054c.5-5.177-.838-9.674-3.549-13.66a.06.06 0 0 0-.031-.03zM8.02 15.33c-1.183 0-2.157-1.085-2.157-2.419 0-1.333.956-2.419 2.157-2.419 1.21 0 2.176 1.096 2.157 2.42 0 1.333-.956 2.418-2.157 2.418zm7.975 0c-1.183 0-2.157-1.085-2.157-2.419 0-1.333.955-2.419 2.157-2.419 1.21 0 2.176 1.096 2.157 2.42 0 1.333-.946 2.418-2.157 2.418z"/></svg>';
    if(s.indexOf('roblox')>-1)return '<img src="/assets/profile/roblox.png" alt="">';
    return '<svg viewBox="0 0 24 24"><path d="M10.6 13.4a1 1 0 0 0 1.4 0l4.2-4.2a2 2 0 0 0-2.8-2.8l-1.5 1.4a1 1 0 0 1-1.4-1.4l1.5-1.4a4 4 0 0 1 5.7 5.6l-4.2 4.2a4 4 0 0 1-5.7 0 4 4 0 0 1 0-5.7l1.4-1.4a1 1 0 0 1 1.4 1.4l-1.4 1.4a2 2 0 0 0 0 2.8 2 2 0 0 0 2.8 0Z"/></svg>';
  }
  fetch(API+'/profile/'+encodeURIComponent(handle))
    .then(function(r){if(!r.ok)throw 0;return r.json()})
    .then(function(j){
      var p=j.profile||{};
      document.getElementById('card').classList.add('show');
      document.title=(p.name||handle)+' — Oxide profile';
      document.getElementById('name').textContent=p.name||handle;
      document.getElementById('handle').textContent='@'+handle;
      document.getElementById('status').textContent=p.status||'Available';
      document.getElementById('bio').textContent=p.bio||'';
      if(p.avatar)document.getElementById('avatar').src=p.avatar;
      if(p.background)document.getElementById('bannerImg').src=p.background;
      (p.tags||'').split(',').map(function(x){return x.trim()}).filter(Boolean).forEach(function(t){
        var e=document.createElement('span');e.className='tag';e.textContent=t;
        document.getElementById('tags').appendChild(e);
      });
      (p.links||[]).forEach(function(l){
        var a=document.createElement('a');a.className='link';a.href=l.url;a.target='_blank';a.rel='noopener noreferrer';
        a.innerHTML='<span class="link-icon">'+iconFor(l.label,l.url)+'</span><span class="link-label">'+l.label+'</span><span class="arrow">→</span>';
        document.getElementById('links').appendChild(a);
      });
      if(p.music){
        var audio=document.getElementById('audio'),btn=document.getElementById('musicBtn');
        audio.src=p.music;audio.volume=0.35;btn.style.display='grid';
        var started=false;
        function tryPlay(){if(started)return;started=true;audio.play().then(function(){btn.classList.add('playing')}).catch(function(){})}
        ['pointerdown','keydown','touchstart'].forEach(function(ev){window.addEventListener(ev,tryPlay,{once:true,passive:true})});
        btn.addEventListener('click',function(){if(audio.paused){audio.play().then(function(){btn.classList.add('playing')}).catch(function(){})}else{audio.pause();btn.classList.remove('playing')}});
      }
    })
    .catch(function(){
      document.getElementById('plain').style.display='block';
      document.querySelector('.plain h1').textContent='Profile not found';
      document.querySelector('.plain p').textContent='This profile doesn\u2019t exist yet. Create yours with the Oxide profile builder.';
      document.querySelector('.plain a').href='/create/';
      document.querySelector('.plain a').textContent='Create your profile';
    });
})();
</script></body></html>
