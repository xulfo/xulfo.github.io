<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Profiles — Oxide Admin</title><link rel="icon" href="/assets/Oxide.png?v=2"><link rel="stylesheet" href="/assets/css/style.css">
<style>
:root{--panel:#101216;--panel2:#0c0e12;--line:rgba(255,255,255,.09);--text:#f3f5f8;--muted:#9da5b3;--blue:#8eafe2;--green:#70d28a;--red:#ef8585;--gold:#e4b96f}
*{box-sizing:border-box}body{min-height:100vh;background:radial-gradient(ellipse at 50% -20%,rgba(129,163,214,.12),transparent 55%),#08090c;color:var(--text);font:14px Inter,system-ui,sans-serif}.shell{width:min(1180px,100%);margin:auto;padding:28px 22px 70px}.top{display:flex;justify-content:space-between;align-items:center;margin-bottom:46px}.brand{color:var(--text);text-decoration:none;font-weight:750;display:flex;align-items:center;gap:9px}.brand img{width:24px;height:24px;border-radius:7px}.back{color:var(--muted);text-decoration:none}.back:hover{color:var(--text)}.heading{display:flex;justify-content:space-between;align-items:end;gap:20px;margin-bottom:22px}.eyebrow{font-size:10px;letter-spacing:.18em;text-transform:uppercase;color:var(--blue);font-weight:750;margin-bottom:10px}.heading h1{font-size:38px;letter-spacing:-.05em;line-height:1}.heading p{color:var(--muted);margin-top:10px}.tools{display:flex;gap:9px;align-items:center}.input,.select{height:40px;border:1px solid var(--line);border-radius:10px;background:var(--panel2);color:var(--text);padding:0 12px;font:inherit;outline:none}.input{width:230px}.select{min-width:145px}.input:focus,.select:focus{border-color:var(--blue)}.surface{border:1px solid var(--line);border-radius:16px;background:rgba(16,18,22,.88);overflow:hidden;box-shadow:0 20px 70px #0005}.table{width:100%;border-collapse:collapse}.table th,.table td{text-align:left;border-bottom:1px solid var(--line);padding:14px 16px}.table th{font-size:10px;letter-spacing:.12em;text-transform:uppercase;color:var(--muted);background:rgba(255,255,255,.025)}.table tr:last-child td{border-bottom:0}.person{display:flex;align-items:center;gap:11px;min-width:190px}.avatar{width:42px;height:42px;border-radius:12px;object-fit:cover;background:#191c24;border:1px solid var(--line)}.person strong{display:block}.sub{color:var(--muted);font-size:11px;margin-top:3px}.badge{display:inline-flex;align-items:center;gap:6px;border-radius:999px;padding:5px 9px;font-size:11px;border:1px solid var(--line);color:var(--muted);background:rgba(255,255,255,.03)}.badge-dot{width:6px;height:6px;border-radius:50%;background:var(--green)}.badge.dnd .badge-dot{background:var(--gold)}.badge.offline .badge-dot{background:#737b89}.tag-preview{display:inline-flex;align-items:center;gap:6px;max-width:180px;border:1px solid color-mix(in srgb,var(--tag-color),transparent 55%);background:color-mix(in srgb,var(--tag-color),transparent 88%);color:var(--tag-color);border-radius:999px;padding:5px 9px;font-size:11px;font-weight:700}.tag-preview img{width:15px;height:15px;object-fit:contain;border-radius:4px}.empty{padding:55px;text-align:center;color:var(--muted)}.drawer{position:fixed;inset:0;background:#0009;backdrop-filter:blur(7px);display:none;align-items:center;justify-content:center;padding:18px;z-index:5}.drawer.open{display:flex}.dialog{width:min(480px,100%);background:#12151b;border:1px solid var(--line);border-radius:18px;padding:23px;box-shadow:0 24px 100px #000b}.dialog h2{font-size:21px;letter-spacing:-.03em}.dialog p{color:var(--muted);font-size:12px;margin:6px 0 20px}.form{display:grid;gap:13px}.label{color:var(--muted);font-size:12px;font-weight:650;display:grid;gap:6px}.label input,.label select{height:42px;border:1px solid var(--line);border-radius:9px;background:var(--panel2);color:var(--text);padding:0 11px;font:inherit;outline:0}.label input:focus,.label select:focus{border-color:var(--blue)}.dialog-actions{display:flex;justify-content:flex-end;gap:8px;margin-top:20px}.button{border:1px solid var(--line);border-radius:9px;height:39px;padding:0 13px;color:var(--text);background:rgba(255,255,255,.06);font:700 12px Inter;cursor:pointer}.button.primary{background:var(--blue);border-color:var(--blue);color:#101722}.button:hover{filter:brightness(1.1)}.notice{min-height:19px;color:var(--red);font-size:12px;margin-top:10px}.count{color:var(--muted);font-size:12px;margin-bottom:12px}@media(max-width:750px){.heading{align-items:flex-start;flex-direction:column}.tools{width:100%}.input{flex:1;width:auto}.table-wrap{overflow-x:auto}.table{min-width:760px}}
</style></head>
<body><div class="shell">
<header class="top"><a class="brand" href="/"><img src="/assets/Oxide.png?v=2" alt="">Oxide HUB</a><a class="back" href="/admin/">← Control room</a></header>
<section class="heading"><div><div class="eyebrow">Profile management</div><h1>Profiles</h1><p>Assign a status or a custom badge to any profile.</p></div><div class="tools"><input class="input" id="search" type="search" placeholder="Search profiles"><select class="select" id="statusFilter"><option value="">All statuses</option><option>Online</option><option>Do not disturb</option><option>Offline</option></select></div></section>
<div class="count" id="count">Loading profiles…</div><section class="surface"><div class="table-wrap"><table class="table"><thead><tr><th>Profile</th><th>Status</th><th>Logo tag</th><th>Discord</th><th>Updated</th><th></th></tr></thead><tbody id="rows"></tbody></table><div class="empty" id="empty" hidden>No profiles found.</div></div></section>
</div>
<div class="drawer" id="drawer"><form class="dialog" id="form"><h2 id="dialogTitle">Edit profile</h2><p>These changes are visible immediately on the public profile.</p><label class="label">Status<select id="editStatus"><option>Online</option><option>Do not disturb</option><option>Offline</option></select></label><label class="label">Logo tag text<input id="tagText" maxlength="28" placeholder="e.g. Founder"></label><label class="label">Logo image URL<input id="tagImage" maxlength="1000" placeholder="https://…/logo.png"></label><label class="label">Tag color<input id="tagColor" type="color" value="#81a3d6"></label><div class="notice" id="notice"></div><div class="dialog-actions"><button class="button" type="button" id="cancel">Cancel</button><button class="button primary" type="submit">Save changes</button></div></form></div>
<script>
(function(){
'use strict';const API='https://adorable-sallyanne-fgdfgdfgd-b2d051be.koyeb.app';let pass=sessionStorage.getItem('oxide_admin_pass')||'',profiles=[],editing='';
const $=id=>document.getElementById(id);const esc=s=>String(s||'');function api(path,opt={}){const headers={'Content-Type':'application/json','X-Admin-Password':pass,'X-Admin-Key':pass,...(opt.headers||{})};return fetch(API+path,{credentials:'include',...opt,headers}).then(async r=>{const j=await r.json().catch(()=>({}));if(!r.ok)throw new Error(j.error||'Request failed');return j})}
function statusClass(s){return s==='Do not disturb'?'dnd':s==='Offline'?'offline':''}function format(t){return t?new Date(t).toLocaleString([], {dateStyle:'medium',timeStyle:'short'}):'—'}
function render(){const q=$('search').value.toLowerCase().trim(),sf=$('statusFilter').value;const list=profiles.filter(p=>(!q||(p.handle+' '+p.name).toLowerCase().includes(q))&&(!sf||p.status===sf));$('rows').replaceChildren();$('empty').hidden=list.length>0;$('count').textContent=list.length+' profile'+(list.length===1?'':'s');list.forEach(p=>{const tr=document.createElement('tr');const td=document.createElement('td');const person=document.createElement('div');person.className='person';const img=document.createElement('img');img.className='avatar';img.src=p.avatar||'/assets/Oxide.png';img.onerror=()=>img.src='/assets/Oxide.png';const copy=document.createElement('div');const strong=document.createElement('strong');strong.textContent=p.name||p.handle;const sub=document.createElement('div');sub.className='sub';sub.textContent='@'+p.handle;copy.append(strong,sub);person.append(img,copy);td.append(person);const st=document.createElement('td');const badge=document.createElement('span');badge.className='badge '+statusClass(p.status);badge.innerHTML='<span class="badge-dot"></span>'+esc(p.status||'Online');st.append(badge);const tag=document.createElement('td');const lt=p.logoTag||{};if(lt.text){const b=document.createElement('span');b.className='tag-preview';b.style.setProperty('--tag-color',lt.color||'#81a3d6');if(lt.image){const li=document.createElement('img');li.src=lt.image;li.alt='';b.append(li)}b.append(document.createTextNode(lt.text));tag.append(b)}else tag.innerHTML='<span class="sub">No tag</span>';const dc=document.createElement('td');dc.className='sub';dc.textContent=p.discord||'—';const up=document.createElement('td');up.className='sub';up.textContent=format(p.updated);const actions=document.createElement('td');const btn=document.createElement('button');btn.className='button';btn.textContent='Edit';btn.onclick=()=>openEditor(p);actions.append(btn);tr.append(td,st,tag,dc,up,actions);$('rows').append(tr)})}
function openEditor(p){editing=p.handle;$('dialogTitle').textContent='Edit @'+p.handle;$('editStatus').value=p.status||'Online';const t=p.logoTag||{};$('tagText').value=t.text||'';$('tagImage').value=t.image||'';$('tagColor').value=/^#[0-9a-f]{6}$/i.test(t.color||'')?t.color:'#81a3d6';$('notice').textContent='';$('drawer').classList.add('open')}
$('search').oninput=render;$('statusFilter').onchange=render;$('cancel').onclick=()=>$('drawer').classList.remove('open');$('form').onsubmit=e=>{e.preventDefault();$('notice').textContent='';api('/admin/api/profiles/'+encodeURIComponent(editing),{method:'PATCH',body:JSON.stringify({status:$('editStatus').value,logoTag:{text:$('tagText').value,image:$('tagImage').value,color:$('tagColor').value}})}).then(()=>{$('drawer').classList.remove('open');load()}).catch(e=>$('notice').textContent=e.message)};
function load(){api('/admin/api/profiles').then(j=>{profiles=j.profiles||[];render()}).catch(e=>{if(/Authentication/i.test(e.message)){location.href='/admin/';return}$('count').textContent=e.message})}load();
})();
</script></body></html>
