@font-face {
  font-family: "Inter";
  src: url("/assets/fonts/inter-var.woff2") format("woff2");
  font-weight: 100 900;
  font-style: normal;
  font-display: swap;
}

* { box-sizing: border-box; margin: 0; padding: 0; }

:root {
  --text: #f0efe9;
  --text-2: #b5b3ab;
  --muted: #7a7872;
  --accent: #81a3d6;
  --border: rgba(255, 255, 255, 0.08);
  --panel: rgba(12, 13, 16, 0.72);
}

html, body { height: 100%; }

body {
  font-family: "Inter", system-ui, -apple-system, "Segoe UI", sans-serif;
  background: #07080a;
  color: var(--text);
  -webkit-font-smoothing: antialiased;
  overflow-x: hidden;
  min-height: 100vh;
  display: flex;
  align-items: center;
  justify-content: center;
  padding: 48px 16px;
}

/* ── Animated background layers ─────────────────────────── */
.bg { position: fixed; inset: 0; z-index: 0; overflow: hidden; background: #07080a; }
.bg-image, .bg-video { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover; opacity: 0; transition: opacity 1.2s ease; }
.bg-image.show, .bg-video.show { opacity: 1; }
.bg::after {
  content: ""; position: absolute; inset: 0;
  background:
    radial-gradient(ellipse 60% 45% at 50% 0%, rgba(129,163,214,0.16), transparent 70%),
    linear-gradient(180deg, rgba(7,8,10,0.55) 0%, rgba(7,8,10,0.78) 100%);
}
.orb { position: absolute; border-radius: 50%; filter: blur(90px); opacity: 0.5; animation: drift 22s ease-in-out infinite alternate; }
.orb-1 { width: 480px; height: 480px; left: -120px; top: -100px; background: rgba(129,163,214,0.35); }
.orb-2 { width: 420px; height: 420px; right: -140px; bottom: -120px; background: rgba(120,90,220,0.28); animation-delay: -8s; }
.orb-3 { width: 300px; height: 300px; left: 30%; bottom: -140px; background: rgba(60,180,160,0.20); animation-delay: -15s; }
@keyframes drift {
  from { transform: translate(0, 0) scale(1); }
  to   { transform: translate(40px, -30px) scale(1.12); }
}
#particles { position: absolute; inset: 0; width: 100%; height: 100%; }

/* ── Card ───────────────────────────────────────────────── */
.card {
  position: relative; z-index: 1;
  width: min(460px, 100%);
  background: var(--panel);
  border: 1px solid var(--border);
  border-radius: 24px;
  backdrop-filter: blur(24px);
  -webkit-backdrop-filter: blur(24px);
  box-shadow: 0 24px 80px rgba(0,0,0,0.6);
  padding: 40px 32px 28px;
  text-align: center;
  animation: rise 0.8s cubic-bezier(0.2, 0.7, 0.2, 1) both;
}
@keyframes rise {
  from { opacity: 0; transform: translateY(24px) scale(0.98); }
  to   { opacity: 1; transform: translateY(0) scale(1); }
}

.back-link {
  position: absolute; top: 18px; left: 20px;
  color: var(--muted); text-decoration: none; font-size: 13px;
  display: inline-flex; align-items: center; gap: 6px; transition: color 0.2s;
}
.back-link:hover { color: var(--text); }
.back-link svg { width: 14px; height: 14px; }

/* Avatar with spinning ring */
.avatar-wrap {
  width: 128px; height: 128px; margin: 6px auto 18px;
  border-radius: 50%; padding: 4px; position: relative;
  background: conic-gradient(from 0deg, #81a3d6, #785adc, #3cb4a0, #e0a34e, #81a3d6);
  animation: spin 6s linear infinite;
}
@keyframes spin { to { transform: rotate(360deg); } }
.avatar-wrap::after {
  content: ""; position: absolute; inset: 4px; border-radius: 50%;
  background: #0a0b0e; z-index: 0;
}
.avatar {
  position: relative; z-index: 1;
  width: 100%; height: 100%; border-radius: 50%;
  object-fit: cover; display: block;
  animation: spin-rev 6s linear infinite;
}
@keyframes spin-rev { to { transform: rotate(-360deg); } }

.name-row { display: flex; align-items: center; justify-content: center; gap: 10px; }
.name { font-size: 30px; font-weight: 800; letter-spacing: -0.02em; }
.verified {
  width: 24px; height: 24px; flex: none;
  border-radius: 50%; display: grid; place-items: center;
  background: linear-gradient(135deg, #81a3d6, #5b7fc0);
  color: #0c1320;
}
.verified svg { width: 14px; height: 14px; }
.handle {
  margin-top: 4px; font-size: 14px; color: var(--muted);
  display: inline-flex; align-items: center; gap: 8px; cursor: pointer;
}
.handle:hover { color: var(--text-2); }
.handle svg { width: 13px; height: 13px; opacity: 0.7; }
.copy-ok { color: #6bcb77; }

/* Tags */
.tags { display: flex; flex-wrap: wrap; gap: 8px; justify-content: center; margin-top: 16px; }
.tag {
  font-size: 12px; font-weight: 600; color: var(--text-2);
  background: rgba(255,255,255,0.05);
  border: 1px solid var(--border);
  padding: 5px 12px; border-radius: 999px;
  display: inline-flex; align-items: center; gap: 6px;
}
.tag svg { width: 12px; height: 12px; color: var(--accent); }

/* Bio */
.bio {
  margin: 20px auto 0; max-width: 340px;
  color: var(--text-2); font-size: 14px; line-height: 1.65;
  white-space: pre-line;
}

/* Links */
.links { display: flex; flex-direction: column; gap: 10px; margin-top: 26px; }
.link {
  display: flex; align-items: center; gap: 14px;
  text-decoration: none; color: var(--text);
  background: rgba(255,255,255,0.04);
  border: 1px solid var(--border);
  border-radius: 14px; padding: 13px 16px;
  transition: transform 0.18s ease, border-color 0.18s ease, background 0.18s ease, box-shadow 0.18s ease;
  animation: rise 0.6s cubic-bezier(0.2, 0.7, 0.2, 1) both;
}
.link:hover {
  transform: translateY(-2px);
  background: rgba(255,255,255,0.07);
  border-color: var(--brand, var(--accent));
  box-shadow: 0 8px 28px rgba(0,0,0,0.4);
}
.link-icon {
  width: 40px; height: 40px; flex: none; border-radius: 11px;
  display: grid; place-items: center;
  background: var(--brand, rgba(255,255,255,0.07));
  color: #fff;
  transition: transform 0.18s ease;
}
.link:hover .link-icon { transform: scale(1.08); }
.link-icon svg { width: 20px; height: 20px; fill: currentColor; }
.link-body { flex: 1; text-align: left; min-width: 0; }
.link-label { font-size: 14.5px; font-weight: 700; }
.link-note { font-size: 12px; color: var(--muted); margin-top: 1px; }
.link-arrow { color: var(--muted); flex: none; transition: transform 0.18s ease, color 0.18s ease; }
.link-arrow svg { width: 16px; height: 16px; display: block; }
.link:hover .link-arrow { transform: translateX(3px); color: var(--text); }

.link[data-icon="discord"]  { --brand: rgba(88,101,242,0.55); }
.link[data-icon="yt"]       { --brand: rgba(255,0,0,0.55); }
.link[data-icon="tiktok"]   { --brand: rgba(255,255,255,0.18); }
.link[data-icon="telegram"] { --brand: rgba(0,136,204,0.55); }
.link[data-icon="x"]        { --brand: rgba(255,255,255,0.18); }
.link[data-icon="instagram"]{ --brand: rgba(225,48,108,0.55); }
.link[data-icon="github"]   { --brand: rgba(255,255,255,0.18); }
.link[data-icon="roblox"]   { --brand: rgba(190,80,200,0.45); }

/* Music button */
.music-btn {
  position: fixed; top: 18px; right: 18px; z-index: 5;
  width: 46px; height: 46px; border-radius: 50%;
  border: 1px solid var(--border);
  background: rgba(12,13,16,0.7);
  backdrop-filter: blur(12px); -webkit-backdrop-filter: blur(12px);
  color: var(--text-2); cursor: pointer;
  display: none; place-items: center;
  transition: color 0.2s, border-color 0.2s, transform 0.2s;
}
.music-btn:hover { color: var(--text); border-color: var(--accent); transform: scale(1.06); }
.music-btn.playing { color: var(--accent); border-color: var(--accent); }
.music-btn svg { width: 20px; height: 20px; }
.music-btn .disc { animation: spin 2.4s linear infinite; }
.music-btn.playing .disc { display: block; }
.music-btn.playing .note { display: none; }
.music-btn .disc { display: none; }
.music-btn .note { display: block; }

/* Footer */
.foot { margin-top: 26px; font-size: 12px; color: var(--muted); }
.foot a { color: var(--muted); text-decoration: none; }
.foot a:hover { color: var(--text-2); }

@media (max-width: 480px) {
  .card { padding: 36px 22px 24px; }
  .name { font-size: 26px; }
}
</style>

  var links = document.getElementById("links");
  (PROFILE.links || []).forEach(function (l, i) {
    var a = document.createElement("a");
    a.className = "link";
    a.href = l.url;
    a.target = "_blank";
    a.rel = "noopener noreferrer";
    a.setAttribute("data-icon", l.icon);
    a.style.animationDelay = (0.15 + i * 0.06) + "s";
    a.innerHTML =
      '<span class="link-icon"><svg viewBox="0 0 24 24">' + (icons[l.icon] || icons.discord) + '</svg></span>' +
      '<span class="link-body"><div class="link-label"></div>' +
      (l.note ? '<div class="link-note"></div>' : "") +
      '</span>' +
      '<span class="link-arrow"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M9 18l6-6-6-6"/></svg></span>';
    a.querySelector(".link-label").textContent = l.label;
    if (l.note) a.querySelector(".link-note").textContent = l.note;
    links.appendChild(a);
  });

  /* ── Background layers ─────────────────────────── */
  if (PROFILE.bgImage) {
    var img = document.getElementById("bgImage");
    img.src = PROFILE.bgImage;
    img.onload = function () { img.classList.add("show"); };
  }
  if (PROFILE.bgVideo) {
    var vid = document.getElementById("bgVideo");
    vid.src = PROFILE.bgVideo;
    vid.play().then(function () { vid.classList.add("show"); }).catch(function () {});
  }

  /* ── Particles ─────────────────────────────────── */
  var canvas = document.getElementById("particles");
  var ctx = canvas.getContext("2d");
  var dots = [];
  function resize() {
    canvas.width = window.innerWidth;
    canvas.height = window.innerHeight;
  }
  resize();
  window.addEventListener("resize", resize);
  var N = Math.min(70, Math.floor(window.innerWidth / 18));
  for (var i = 0; i < N; i++) {
    dots.push({
      x: Math.random() * canvas.width,
      y: Math.random() * canvas.height,
      r: Math.random() * 1.6 + 0.4,
      vx: (Math.random() - 0.5) * 0.18,
      vy: (Math.random() - 0.5) * 0.18,
      a: Math.random() * 0.5 + 0.15,
    });
  }
  (function tick() {
    ctx.clearRect(0, 0, canvas.width, canvas.height);
    for (var i = 0; i < dots.length; i++) {
      var d = dots[i];
      d.x += d.vx; d.y += d.vy;
      if (d.x < 0 || d.x > canvas.width) d.vx *= -1;
      if (d.y < 0 || d.y > canvas.height) d.vy *= -1;
      ctx.beginPath();
      ctx.arc(d.x, d.y, d.r, 0, Math.PI * 2);
      ctx.fillStyle = "rgba(255,255,255," + d.a.toFixed(2) + ")";
      ctx.fill();
    }
    requestAnimationFrame(tick);
  })();

  /* ── Background music ──────────────────────────── */
  var audio = document.getElementById("audio");
  var btn = document.getElementById("musicBtn");
  var started = false;
  function tryPlay() {
    if (!PROFILE.music || started) return;
    started = true;
    audio.play().then(function () {
      btn.classList.add("playing");
    }).catch(function () {});
  }
  if (PROFILE.music) {
    audio.src = PROFILE.music;
    audio.volume = 0.35;
    btn.style.display = "grid";
    /* Browsers block autoplay with sound — start on first interaction. */
    ["pointerdown", "keydown", "touchstart"].forEach(function (ev) {
      window.addEventListener(ev, tryPlay, { once: true, passive: true });
    });
    btn.addEventListener("click", function () {
      if (audio.paused) {
        audio.play().then(function () { btn.classList.add("playing"); }).catch(function () {});
      } else {
        audio.pause();
        btn.classList.remove("playing");
      }
    });
  }
})();
</script>
