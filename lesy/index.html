<style>
@font-face {
  font-family: "Inter";
  src: url("/assets/fonts/inter-var.woff2") format("woff2");
  font-weight: 100 900;
  font-style: normal;
  font-display: swap;
}

* { box-sizing: border-box; margin: 0; padding: 0; }

:root {
  --text: #f2f1ec;
  --text-2: #b8b6ae;
  --muted: #85837b;
  --accent: #81a3d6;
  --border: rgba(255, 255, 255, 0.08);
  --panel: rgba(10, 11, 14, 0.66);
}

html, body { height: 100%; }

body {
  font-family: "Inter", system-ui, -apple-system, "Segoe UI", sans-serif;
  background: #06070a;
  color: var(--text);
  -webkit-font-smoothing: antialiased;
  overflow-x: hidden;
  min-height: 100vh;
  display: flex;
  flex-direction: column;
}

/* ── Background ───────────────────────────────────────────── */
.bg { position: fixed; inset: 0; z-index: 0; overflow: hidden; background: #06070a; }
.bg-image, .bg-video { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover; opacity: 0; transition: opacity 1.4s ease; }
.bg-image.show, .bg-video.show { opacity: 1; }
.bg::after {
  content: ""; position: absolute; inset: 0;
  background:
    radial-gradient(ellipse 70% 55% at 50% 0%, rgba(6,7,10,0.10) 0%, rgba(6,7,10,0.72) 78%, rgba(6,7,10,0.92) 100%),
    linear-gradient(180deg, rgba(6,7,10,0.35) 0%, rgba(6,7,10,0.55) 100%);
}

/* ── Top bar ──────────────────────────────────────────────── */
.topbar {
  position: relative; z-index: 2;
  width: 100%; max-width: 720px; margin: 0 auto;
  padding: 22px 20px 0;
  display: flex; align-items: center; justify-content: space-between;
}
.brand {
  display: inline-flex; align-items: center; gap: 9px;
  text-decoration: none; color: var(--text); font-weight: 700; font-size: 15px;
}
.brand img { width: 22px; height: 22px; border-radius: 6px; }
.brand span { opacity: 0.9; }
.back {
  color: var(--muted); text-decoration: none; font-size: 13.5px;
  display: inline-flex; align-items: center; gap: 6px;
  transition: color 0.2s;
}
.back:hover { color: var(--text); }
.back svg { width: 14px; height: 14px; }

/* ── Card ─────────────────────────────────────────────────── */
main { position: relative; z-index: 1; flex: 1; display: flex; align-items: center; justify-content: center; padding: 32px 16px 24px; }

.card {
  width: min(440px, 100%);
  position: relative;
  overflow: hidden;
  background: var(--panel);
  border: 1px solid var(--border);
  border-radius: 22px;
  backdrop-filter: blur(26px) saturate(1.15);
  -webkit-backdrop-filter: blur(26px) saturate(1.15);
  box-shadow: 0 30px 90px rgba(0, 0, 0, 0.55);
  padding: 0;
  text-align: center;
  animation: rise 0.7s cubic-bezier(0.2, 0.7, 0.2, 1) both;
}
.banner { position: relative; height: 128px; background: #0b0d10; }
.banner img { width: 100%; height: 100%; object-fit: cover; display: block; }
.banner::after {
  content: ""; position: absolute; inset: 0;
  background: linear-gradient(180deg, rgba(0, 0, 0, 0.10), rgba(10, 11, 15, 0.9));
}
.body { padding: 12px 34px 30px; position: relative; z-index: 1; }
.card::before {
  content: "";
  position: absolute;
  top: 0;
  left: 14%;
  right: 14%;
  height: 1px;
  background: linear-gradient(90deg, transparent, rgba(129, 163, 214, 0.8), transparent);
  box-shadow: 0 0 24px rgba(129, 163, 214, 0.5);
}
.card > * { position: relative; z-index: 1; }
@keyframes rise {
  from { opacity: 0; transform: translateY(18px); }
  to   { opacity: 1; transform: translateY(0); }
}

.eyebrow {
  font-size: 11px; font-weight: 600; letter-spacing: 0.22em;
  text-transform: uppercase; color: var(--muted); margin-bottom: 18px;
}

/* Avatar — rounded square, subtle ring, overlaps the banner */
.avatar {
  width: 104px; height: 104px;
  border-radius: 26px;
  object-fit: cover;
  border: 4px solid #0d0f12;
  box-shadow: 0 10px 34px rgba(0, 0, 0, 0.55);
  margin: -52px auto 0;
  position: relative;
  z-index: 2;
  display: block;
  transition: transform 0.25s ease;
}
.avatar:hover { transform: scale(1.03); }

.name-row { display: flex; align-items: center; justify-content: center; gap: 10px; }
.name { font-size: 29px; font-weight: 800; letter-spacing: -0.02em; line-height: 1.15; text-shadow: 0 2px 18px rgba(255,255,255,0.08); }
.verified {
  width: 22px; height: 22px; flex: none;
  border-radius: 50%; display: grid; place-items: center;
  background: #3b82f6;
  color: #fff;
  box-shadow: 0 0 0 3px rgba(59, 130, 246, 0.13), 0 4px 14px rgba(59, 130, 246, 0.28);
}
.verified svg { width: 13px; height: 13px; display: block; }

.handle {
  margin-top: 5px; font-size: 14px; color: var(--muted);
  display: inline-flex; align-items: center; gap: 7px; cursor: pointer;
  border: none; background: none; font-family: inherit;
  transition: color 0.2s;
}
.handle:hover { color: var(--text-2); }
.handle svg { width: 13px; height: 13px; opacity: 0.65; }
.copy-ok { color: #6bcb77 !important; }

/* Status */
.status {
  margin-top: 12px; display: inline-flex; align-items: center; gap: 7px;
  font-size: 12.5px; color: var(--text-2);
  background: rgba(255, 255, 255, 0.04);
  border: 1px solid var(--border);
  border-radius: 999px; padding: 4px 12px;
}
.status-dot {
  width: 7px; height: 7px; border-radius: 50%;
  background: #6bcb77; position: relative;
}
.status-dot::after {
  content: ""; position: absolute; inset: -4px; border-radius: 50%;
  border: 1px solid rgba(107, 203, 119, 0.5);
  animation: pulse 2s ease-out infinite;
}
@keyframes pulse {
  0%   { transform: scale(0.5); opacity: 1; }
  100% { transform: scale(1.4); opacity: 0; }
}

/* Tags */
.tags { display: flex; flex-wrap: wrap; gap: 8px; justify-content: center; margin-top: 16px; }
.tag {
  font-size: 12px; font-weight: 600; color: var(--text-2);
  background: rgba(255, 255, 255, 0.05);
  border: 1px solid var(--border);
  padding: 5px 12px; border-radius: 999px;
  transition: background .2s ease, border-color .2s ease, transform .2s ease;
}
.tag:hover { background: rgba(129, 163, 214, 0.10); border-color: rgba(129, 163, 214, 0.28); transform: translateY(-1px); }

/* Bio */
.bio {
  margin: 20px auto 0; max-width: 330px;
  color: var(--text-2); font-size: 13.5px; line-height: 1.7;
  white-space: pre-line;
}

/* Links */
.links {
  display: flex;
  flex-direction: column;
  gap: 10px;
  margin-top: 28px;
}
.links::before {
  content: "Connect with me";
  display: block;
  text-align: left;
  color: var(--muted);
  font-size: 10px;
  font-weight: 700;
  letter-spacing: 0.18em;
  text-transform: uppercase;
  margin: 0 2px 2px;
}
.link {
  display: flex; align-items: center; gap: 14px;
  text-decoration: none; color: var(--text);
  background: rgba(255, 255, 255, 0.035);
  border: 1px solid var(--border);
  border-radius: 14px; padding: 12px 15px;
  transition: transform 0.18s ease, border-color 0.18s ease, background 0.18s ease, box-shadow 0.18s ease;
  animation: rise 0.55s cubic-bezier(0.2, 0.7, 0.2, 1) both;
}
.link:hover {
  transform: translateY(-1.5px);
  background: rgba(255, 255, 255, 0.06);
  border-color: var(--brand, var(--accent));
  box-shadow: 0 10px 30px rgba(0, 0, 0, 0.35);
}
.link-icon {
  width: 38px; height: 38px; flex: none; border-radius: 10px;
  display: grid; place-items: center;
  background: var(--brand-bg, rgba(255, 255, 255, 0.07));
  color: var(--brand, #fff);
  transition: transform 0.18s ease;
}
.link:hover .link-icon { transform: scale(1.07); }
.link-icon svg { width: 19px; height: 19px; fill: currentColor; }
.link-icon img { width: 27px; height: 27px; object-fit: contain; display: block; }
.link[data-icon="roblox"] .link-icon { width: 42px; height: 42px; }
.link[data-icon="roblox"] .link-icon img { width: 30px; height: 30px; }
.link-body { flex: 1; text-align: left; min-width: 0; }
.link-label { font-size: 14.5px; font-weight: 700; }
.link-note { font-size: 12px; color: var(--muted); margin-top: 1px; }
.link-arrow { color: var(--muted); flex: none; transition: transform 0.18s ease, color 0.18s ease; }
.link-arrow svg { width: 15px; height: 15px; display: block; }
.link:hover .link-arrow { transform: translateX(3px); color: var(--text); }

.link[data-icon="discord"]   { --brand: #8b94ff; --brand-bg: rgba(88, 101, 242, 0.18); background: rgba(88, 101, 242, 0.055); }
.link[data-icon="discord"] .link-label::after { content: "  •  MAIN"; color: #8b94ff; font-size: 9px; letter-spacing: 0.1em; vertical-align: 1px; }
.link[data-icon="yt"]        { --brand: #ff4d4d; --brand-bg: rgba(255, 0, 0, 0.14); }
.link[data-icon="tiktok"]    { --brand: #e8e6e1; --brand-bg: rgba(255, 255, 255, 0.10); }
.link[data-icon="telegram"]  { --brand: #4db8e8; --brand-bg: rgba(0, 136, 204, 0.16); }
.link[data-icon="x"]         { --brand: #e8e6e1; --brand-bg: rgba(255, 255, 255, 0.10); }
.link[data-icon="instagram"] { --brand: #ff6b9d; --brand-bg: rgba(225, 48, 108, 0.16); }
.link[data-icon="github"]    { --brand: #e8e6e1; --brand-bg: rgba(255, 255, 255, 0.10); }
.link[data-icon="roblox"]    { --brand: #f0f0f0; --brand-bg: rgba(255, 255, 255, 0.10); }

/* Music */
.music-btn {
  position: fixed; top: 18px; right: 18px; z-index: 5;
  width: 42px; height: 42px; border-radius: 50%;
  border: 1px solid var(--border);
  background: rgba(10, 11, 14, 0.6);
  backdrop-filter: blur(14px); -webkit-backdrop-filter: blur(14px);
  color: var(--text-2); cursor: pointer;
  display: none; place-items: center;
  transition: color 0.2s, border-color 0.2s, transform 0.2s;
}
.music-btn:hover { color: var(--text); border-color: rgba(255, 255, 255, 0.2); transform: scale(1.06); }
.music-btn.playing { color: var(--accent); border-color: rgba(129, 163, 214, 0.5); }
.music-btn svg { width: 19px; height: 19px; }
.music-btn .disc { display: none; animation: spin 2.6s linear infinite; }
.music-btn.playing .disc { display: block; }
.music-btn.playing .note { display: none; }
.music-btn .note { display: block; }
@keyframes spin { to { transform: rotate(360deg); } }

@media (max-width: 480px) {
  .body { padding: 12px 24px 26px; }
  .name { font-size: 26px; }
}
</style>
</head>

  var links = document.getElementById("links");
  (PROFILE.links || []).forEach(function (l, i) {
    var a = document.createElement("a");
    a.className = "link";
    a.href = l.url;
    a.target = "_blank";
    a.rel = "noopener noreferrer";
    a.setAttribute("data-icon", l.icon);
    a.style.animationDelay = (0.12 + i * 0.05) + "s";
    var iconMarkup = l.icon === "roblox"
      ? '<img src="/assets/profile/roblox.png" alt="">'
      : '<svg viewBox="0 0 24 24">' + (icons[l.icon] || icons.discord) + '</svg>';
    a.innerHTML =
      '<span class="link-icon">' + iconMarkup + '</span>' +
      '<span class="link-body"><div class="link-label"></div>' +
      (l.note ? '<div class="link-note"></div>' : "") +
      '</span>' +
      '<span class="link-arrow"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M9 18l6-6-6-6"/></svg></span>';
    a.querySelector(".link-label").textContent = l.label;
    if (l.note) a.querySelector(".link-note").textContent = l.note;
    links.appendChild(a);
  });

  /* ── Background layers ─────────────────────────── */
  if (PROFILE.bgImage) {
    var img = document.getElementById("bgImage");
    img.src = PROFILE.bgImage;
    img.onload = function () { img.classList.add("show"); };
    var banner = document.getElementById("bannerImg");
    banner.src = PROFILE.bgImage;
  }
  if (PROFILE.bgVideo) {
    var vid = document.getElementById("bgVideo");
    vid.src = PROFILE.bgVideo;
    vid.play().then(function () { vid.classList.add("show"); }).catch(function () {});
  }

  /* ── Background music ──────────────────────────── */
  var audio = document.getElementById("audio");
  var btn = document.getElementById("musicBtn");
  var started = false;
  function tryPlay() {
    if (!PROFILE.music || started) return;
    started = true;
    audio.play().then(function () { btn.classList.add("playing"); }).catch(function () {});
  }
  if (PROFILE.music) {
    audio.src = PROFILE.music;
    audio.volume = 0.35;
    btn.style.display = "grid";
    ["pointerdown", "keydown", "touchstart"].forEach(function (ev) {
      window.addEventListener(ev, tryPlay, { once: true, passive: true });
    });
    btn.addEventListener("click", function () {
      if (audio.paused) {
        audio.play().then(function () { btn.classList.add("playing"); }).catch(function () {});
      } else {
        audio.pause();
        btn.classList.remove("playing");
      }
    });
  }
})();
</script>
